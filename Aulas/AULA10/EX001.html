<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 10</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #fd7b8691;
        }
        input, select {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        input[type="button"] {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="button"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div>
        <input type="number" placeholder="Digite um Número" id="n1">
        <input type="number" placeholder="Digite outro número" id="n2">
        <select>
            <option value="">Escolha uma operação</option>
            <option value="soma">Soma</option>
            <option value="subtracao">Subtração</option>
            <option value="multiplicacao">Multiplicação</option>
            <option value="divisao">Divisão</option>
        </select>
        <input type="button" value="Calcular" id="calcular">
    </div>

    <script>
        const n1 = document.getElementById('n1');
        const n2 = document.getElementById('n2');
        const select = document.querySelector('select');
        const calcular = document.getElementById('calcular');

        calcular.addEventListener('click', function() {
            const num1 = parseFloat(n1.value);
            const num2 = parseFloat(n2.value);
            const operacao = select.value;

            let resultado;

            switch (operacao) {
                case 'soma':
                    resultado = num1 + num2;
                    break;
                case 'subtracao':
                    resultado = num1 - num2;
                    break;
                case 'multiplicacao':
                    resultado = num1 * num2;
                    break;
                case 'divisao':
                    if (num2 !== 0) {
                        resultado = num1 / num2;
                    } else {
                        resultado = 'Erro: Divisão por zero';
                    }
                    break;
                default:
                    resultado = 'Por favor, escolha uma operação válida';
            }

            alert(`O resultado é: ${resultado}`);
        });

    </script>
</body>
</html>
