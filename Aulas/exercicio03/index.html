<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de genero e idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Faça aqui sua verificação de idade e genero</h1>
    </header>
    <section>
        <div>
            <input type="number" id="ano" placeholder="Digite o ano de nascimento">
            <p>
                <input type="radio" name="genero" id="masc" value="masculino">
                <label for="masc">Masculino</label>
                <input type="radio" name="genero" id="fem" value="feminino">
                <label for="fem">Feminino</label>
            </p>
            <p>
                <input type="button" id="verificar" value="Verificar" onclick="verificar()">
            </p>
        </div>
        <div id="res">
        </div>
    </section>
    <script src="index.js"></script>
</body>
</html>
