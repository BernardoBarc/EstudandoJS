<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passaporte</title>
</head>
<body>
    <h1>Tire aqui seu passaporte</h1>
    Você é <input type="text" placeholder="Digite sua nacionalidade" id="pais">
    <input type="button" value="Enviar" onclick="gerar()"><br><br>
    <div id="resultado"></div>

    <script>
        function gerar(){
            var pais = document.getElementById('pais').value
            var res = document.getElementById('resultado')
            if(pais == 'Brasil' || pais == 'brasil' || pais == 'BRASIL') {
                res.innerHTML = 'Passaporte Brasileiro'
            }else {
                res.innerHTML = 'Passaporte Estrangeiro'
            }

        }
    </script>
</body>
</html>
