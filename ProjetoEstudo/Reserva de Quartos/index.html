<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Quartos</title>
</head>
<body>

    <h1>Reserve aqui seu quarto</h1>
    <p>Nome Completo: </p><input type="text" id="nome">
    <p>Quantos dias você ficará hospedado: </p><input type="number" id="diaria">
    <br><br>
    <p>Escolha o quarto desejado:</p><select id="quartos">
        <option value="simples">Quarto Simples</option>
        <option value="duplo">Quarto Duplo</option>
        <option value="familia">Quarto Familia</option>
        <option value="suite">Suíte</option>
    </select>
    <br><br>
    <button onclick="reservar()">Fazer Reserva</button>
    <br><br>
    <div id="res"></div>
    

    <script src="script.js"></script>
</body>
</html>
