<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Calculadora</title>
    <style>
        body{
            background-color: #000000;
        }
        #calculadora {
            width: 250px;
            padding: 25px;
            border: 2px solid #ffffff;
            border-radius: 15px;
            text-align: center;
            margin: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #84baf5bb;
        }
        #display {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;
            text-align: right;
            font-size: 18px;
            border-radius: 12px;
            background-color: rgb(255, 255, 255);
        }
        button {
            width: 45px;
            height: 45px;
            margin: 5px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="calculadora">
        <input type="text" id="display" disabled>
        <br>
        <button onclick="adicionarNumero('7')">7</button>
        <button onclick="adicionarNumero('8')">8</button>
        <button onclick="adicionarNumero('9')">9</button>
        <button onclick="adicionarOperacao('+')">+</button>
        <br>
        <button onclick="adicionarNumero('4')">4</button>
        <button onclick="adicionarNumero('5')">5</button>
        <button onclick="adicionarNumero('6')">6</button>
        <button onclick="adicionarOperacao('-')">-</button>
        <br>
        <button onclick="adicionarNumero('1')">1</button>
        <button onclick="adicionarNumero('2')">2</button>
        <button onclick="adicionarNumero('3')">3</button>
        <button onclick="adicionarOperacao('*')">*</button>
        <br>
        <button onclick="adicionarNumero('0')">0</button>
        <button onclick="calcular()">=</button>
        <button onclick="limpar()">C</button>
        <button onclick="adicionarOperacao('/')">/</button>

    </div>

    <script>
        let operacao = '';
        let numero1 = '';
        let numero2 = '';

        function adicionarNumero(num) {
            const display = document.getElementById('display');
            display.value += num;
        }

        function adicionarOperacao(op) {
            operacao = op;
            numero1 = display.value;
            display.value = '';
        }

        function calcular() {
            numero2 = display.value;
            let resultado;

            switch (operacao) {
                case '+':
                    resultado = parseFloat(numero1) + parseFloat(numero2);
                    break;
                case '-':
                    resultado = parseFloat(numero1) - parseFloat(numero2);
                    break;
                case '*':
                    resultado = parseFloat(numero1) * parseFloat(numero2);
                    break;
                case '/':
                    resultado = parseFloat(numero1) / parseFloat(numero2);
                    break;
                default:
                    resultado = 'Erro';
            }

            display.value = resultado;
        }

        function limpar() {
            const display = document.getElementById('display');
            display.value = '';
            operacao = '';
            numero1 = '';
            numero2 = '';
        }
    </script>
</body>
</html>
