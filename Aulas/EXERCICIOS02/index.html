<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Exercicio 02</title>
</head>
<body>
    <header>
        <h1>Preencha os campos conforme sua necessidade</h1>
    </header>

    <section>
        <div id="dados">
            <input type="text" id="nome" placeholder="Digite seu nome">
            <input type="email" id="email" placeholder="Digite seu email">
            <input type="number" id="idade" placeholder="Digite sua idade">
        </div>
        <div id="genero">
            <input type="radio" id="masculino" name="genero" value="masculino"> Masculino
            <input type="radio" id="feminino" name="genero" value="feminino"> Feminino
            <input type="button" id="enviar" value="Enviar" onclick="enviar()">
        </div>
        <div id="res"></div>
    </section>

    <footer>
        <p>Todos os direitos reservados - 2026</p>
    </footer>
    
    <script src="index.js"></script>
</body>
</html>
